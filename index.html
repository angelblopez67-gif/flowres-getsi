<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Para Getsi</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #08051a;
      height: 100vh;
      overflow: hidden;
      font-family: Georgia, 'Times New Roman', serif;
      color: #e6d9ff;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #sky {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 30%, #1c1438 0%, #0a0618 65%);
    }

    /* Estrellas de fondo */
    .bg-star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      opacity: 0.55;
      animation: twinkle 4s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.25; transform: scale(0.7); }
      50% { opacity: 0.95; transform: scale(1.15); }
    }

    /* Flores */
    .flower-container {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 180px;
      pointer-events: none;
    }

    .flower {
      position: absolute;
      bottom: 0;
      transform-origin: bottom center;
      animation: sway 7s ease-in-out infinite;
    }

    .stem {
      width: 3px;
      background: linear-gradient(to top, #f5b0c2, #f8c8d4);
      margin: 0 auto;
      border-radius: 4px;
      position: relative;
    }

    .leaf {
      position: absolute;
      width: 14px;
      height: 8px;
      background: #d4a0e0;
      border-radius: 50% 0 50% 0;
      opacity: 0.8;
    }

    .petals {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      width: 42px;
      height: 42px;
    }

    .petal {
      position: absolute;
      width: 18px;
      height: 26px;
      background: linear-gradient(135deg, #d4a8f0, #b07cd8);
      border-radius: 50% 50% 40% 40%;
      top: 6px;
      left: 12px;
      transform-origin: center 85%;
      box-shadow: 0 0 6px rgba(180, 120, 220, 0.3);
    }

    .petal:nth-child(1) { transform: rotate(0deg); }
    .petal:nth-child(2) { transform: rotate(72deg); }
    .petal:nth-child(3) { transform: rotate(144deg); }
    .petal:nth-child(4) { transform: rotate(216deg); }
    .petal:nth-child(5) { transform: rotate(288deg); }

    .center {
      position: absolute;
      width: 12px;
      height: 12px;
      background: #f0d8ff;
      border-radius: 50%;
      top: 14px;
      left: 15px;
      box-shadow: 0 0 10px #e0b8ff;
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(4deg); }
    }

    /* Constelación */
    #constellation {
      position: absolute;
      top: 22%;
      left: 50%;
      transform: translateX(-50%);
      width: 94vw;
      max-width: 440px;
      height: 180px;
      z-index: 5;
    }

    #constellation svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .c-star {
      fill: #fff;
      opacity: 0;
      filter: drop-shadow(0 0 5px #d8b8ff);
      transition: opacity 0.7s ease;
    }

    .c-star.on {
      opacity: 1;
    }

    .c-line {
      stroke: #c9a0e8;
      stroke-width: 1.3;
      stroke-linecap: round;
      opacity: 0;
      transition: opacity 0.9s ease;
    }

    .c-line.on {
      opacity: 0.65;
    }

    /* Texto e instrucciones */
    #hint {
      position: absolute;
      bottom: 14%;
      width: 100%;
      text-align: center;
      font-size: 14px;
      letter-spacing: 1.5px;
      opacity: 0.55;
      transition: opacity 1.2s;
      z-index: 10;
    }

    #hint.hide {
      opacity: 0;
    }

    #final-msg {
      position: absolute;
      bottom: 16%;
      width: 100%;
      text-align: center;
      opacity: 0;
      transition: opacity 2.2s ease;
      padding: 0 24px;
      z-index: 10;
    }

    #final-msg.show {
      opacity: 1;
    }

    #final-msg p {
      font-size: 15px;
      line-height: 1.65;
      color: #d4c4f0;
      text-shadow: 0 0 14px rgba(160, 120, 230, 0.35);
    }

    /* Destellos */
    .spark {
      position: absolute;
      width: 5px;
      height: 5px;
      background: #fff;
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 0 10px #e8d0ff;
      animation: spark-anim 0.9s forwards;
      z-index: 20;
    }

    @keyframes spark-anim {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0); opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="sky"></div>

  <!-- Flores -->
  <div class="flower-container">
    <div class="flower" style="left: 6%; animation-delay: 0s;">
      <div class="stem" style="height: 110px;"></div>
      <div class="leaf" style="top: 45px; left: -8px; transform: rotate(-25deg);"></div>
      <div class="leaf" style="top: 70px; left: 6px; transform: rotate(30deg);"></div>
      <div class="petals">
        <div class="petal"></div><div class="petal"></div><div class="petal"></div>
        <div class="petal"></div><div class="petal"></div>
        <div class="center"></div>
      </div>
    </div>

    <div class="flower" style="left: 24%; animation-delay: 1.4s; transform: scale(0.82);">
      <div class="stem" style="height: 85px;"></div>
      <div class="leaf" style="top: 40px; left: -6px; transform: rotate(-20deg);"></div>
      <div class="petals">
        <div class="petal"></div><div class="petal"></div><div class="petal"></div>
        <div class="petal"></div><div class="petal"></div>
        <div class="center"></div>
      </div>
    </div>

    <div class="flower" style="left: 58%; animation-delay: 0.7s;">
      <div class="stem" style="height: 125px;"></div>
      <div class="leaf" style="top: 55px; left: -9px; transform: rotate(-28deg);"></div>
      <div class="leaf" style="top: 80px; left: 7px; transform: rotate(25deg);"></div>
      <div class="petals">
        <div class="petal"></div><div class="petal"></div><div class="petal"></div>
        <div class="petal"></div><div class="petal"></div>
        <div class="center"></div>
      </div>
    </div>

    <div class="flower" style="left: 78%; animation-delay: 2s; transform: scale(0.75);">
      <div class="stem" style="height: 75px;"></div>
      <div class="petals">
        <div class="petal"></div><div class="petal"></div><div class="petal"></div>
        <div class="petal"></div><div class="petal"></div>
        <div class="center"></div>
      </div>
    </div>
  </div>

  <!-- Constelación GETSI -->
  <div id="constellation">
    <svg viewBox="0 0 420 160" preserveAspectRatio="xMidYMid meet">
      <!-- G -->
      <circle class="c-star" cx="28" cy="35" r="3.2"/>
      <circle class="c-star" cx="18" cy="58" r="3.2"/>
      <circle class="c-star" cx="25" cy="85" r="3.2"/>
      <circle class="c-star" cx="48" cy="98" r="3.2"/>
      <circle class="c-star" cx="68" cy="78" r="3.2"/>
      <circle class="c-star" cx="58" cy="52" r="3.2"/>

      <!-- E -->
      <circle class="c-star" cx="105" cy="32" r="3.2"/>
      <circle class="c-star" cx="105" cy="58" r="3.2"/>
      <circle class="c-star" cx="105" cy="90" r="3.2"/>
      <circle class="c-star" cx="132" cy="32" r="3.2"/>
      <circle class="c-star" cx="130" cy="58" r="3.2"/>
      <circle class="c-star" cx="132" cy="90" r="3.2"/>

      <!-- T -->
      <circle class="c-star" cx="175" cy="32" r="3.2"/>
      <circle class="c-star" cx="198" cy="32" r="3.2"/>
      <circle class="c-star" cx="221" cy="32" r="3.2"/>
      <circle class="c-star" cx="198" cy="58" r="3.2"/>
      <circle class="c-star" cx="198" cy="92" r="3.2"/>

      <!-- S -->
      <circle class="c-star" cx="268" cy="38" r="3.2"/>
      <circle class="c-star" cx="252" cy="55" r="3.2"/>
      <circle class="c-star" cx="268" cy="72" r="3.2"/>
      <circle class="c-star" cx="285" cy="88" r="3.2"/>
      <circle class="c-star" cx="268" cy="102" r="3.2"/>

      <!-- I -->
      <circle class="c-star" cx="330" cy="32" r="3.2"/>
      <circle class="c-star" cx="330" cy="58" r="3.2"/>
      <circle class="c-star" cx="330" cy="92" r="3.2"/>

      <!-- Líneas -->
      <line class="c-line" x1="28" y1="35" x2="18" y2="58"/>
      <line class="c-line" x1="18" y1="58" x2="25" y2="85"/>
      <line class="c-line" x1="25" y1="85" x2="48" y2="98"/>
      <line class="c-line" x1="48" y1="98" x2="68" y2="78"/>
      <line class="c-line" x1="68" y1="78" x2="58" y2="52"/>

      <line class="c-line" x1="105" y1="32" x2="105" y2="90"/>
      <line class="c-line" x1="105" y1="32" x2="132" y2="32"/>
      <line class="c-line" x1="105" y1="58" x2="130" y2="58"/>
      <line class="c-line" x1="105" y1="90" x2="132" y2="90"/>

      <line class="c-line" x1="175" y1="32" x2="221" y2="32"/>
      <line class="c-line" x1="198" y1="32" x2="198" y2="92"/>

      <line class="c-line" x1="268" y1="38" x2="252" y2="55"/>
      <line class="c-line" x1="252" y1="55" x2="268" y2="72"/>
      <line class="c-line" x1="268" y1="72" x2="285" y2="88"/>
      <line class="c-line" x1="285" y1="88" x2="268" y2="102"/>

      <line class="c-line" x1="330" y1="32" x2="330" y2="92"/>
    </svg>
  </div>

  <div id="hint">Toca la pantalla</div>

  <div id="final-msg">
    <p>Algunas estrellas brillan más fuerte<br>cuando tienen un nombre especial.</p>
  </div>

  <script>
    // Estrellas de fondo
    const sky = document.getElementById('sky');
    for (let i = 0; i < 140; i++) {
      const star = document.createElement('div');
      star.className = 'bg-star';
      const size = Math.random() * 2.4 + 0.7;
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 5 + 's';
      star.style.animationDuration = (2.5 + Math.random() * 3.5) + 's';
      sky.appendChild(star);
    }

    const cStars = document.querySelectorAll('.c-star');
    const cLines = document.querySelectorAll('.c-line');
    let started = false;

    function startExperience() {
      if (started) return;
      started = true;

      document.getElementById('hint').classList.add('hide');

      // Aparecen las estrellas de la constelación
      cStars.forEach((star, index) => {
        setTimeout(() => {
          star.classList.add('on');
        }, index * 160);
      });

      // Luego las líneas
      setTimeout(() => {
        cLines.forEach((line, index) => {
          setTimeout(() => {
            line.classList.add('on');
          }, index * 110);
        });
      }, cStars.length * 160 + 500);

      // Mensaje final
      setTimeout(() => {
        document.getElementById('final-msg').classList.add('show');
      }, cStars.length * 160 + cLines.length * 110 + 1400);
    }

    function createSpark(x, y) {
      const spark = document.createElement('div');
      spark.className = 'spark';
      spark.style.left = (x - 2.5) + 'px';
      spark.style.top = (y - 2.5) + 'px';
      document.body.appendChild(spark);
      setTimeout(() => spark.remove(), 900);
    }

    function onInteract(e) {
      const point = e.touches ? e.touches[0] : e;
      createSpark(point.clientX, point.clientY);
      startExperience();
    }

    document.addEventListener('click', onInteract);
    document.addEventListener('touchstart', onInteract, { passive: true });
  </script>
</body>
</html>
