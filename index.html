<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Para Getsi ♡</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0618;
      overflow: hidden;
      height: 100vh;
      font-family: 'Georgia', serif;
      color: #e8d9ff;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #sky {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, #1a1235 0%, #0a0618 70%);
    }

    /* Estrellas de fondo */
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0.6;
      animation: twinkle 3s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.1); }
    }

    /* Flores */
    .flower {
      position: absolute;
      bottom: 0;
      transform-origin: bottom center;
      animation: sway 6s ease-in-out infinite;
    }

    .flower .stem {
      width: 3px;
      height: 90px;
      background: #f8b4c4;
      margin: 0 auto;
      border-radius: 3px;
      position: relative;
    }

    .flower .petals {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 36px;
      height: 36px;
    }

    .flower .petal {
      position: absolute;
      width: 16px;
      height: 22px;
      background: #c9a0e8;
      border-radius: 50% 50% 40% 40%;
      top: 8px;
      left: 10px;
      transform-origin: center bottom;
    }

    .flower .petal:nth-child(1) { transform: rotate(0deg); }
    .flower .petal:nth-child(2) { transform: rotate(72deg); }
    .flower .petal:nth-child(3) { transform: rotate(144deg); }
    .flower .petal:nth-child(4) { transform: rotate(216deg); }
    .flower .petal:nth-child(5) { transform: rotate(288deg); }

    .flower .center {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #f0d0ff;
      border-radius: 50%;
      top: 13px;
      left: 13px;
      box-shadow: 0 0 8px #e0b0ff;
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }

    /* Constelación GETSI */
    #constellation {
      position: absolute;
      top: 28%;
      left: 50%;
      transform: translateX(-50%);
      width: 92vw;
      max-width: 420px;
      height: 160px;
    }

    #constellation svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .const-star {
      fill: #fff;
      opacity: 0;
      filter: drop-shadow(0 0 6px #d0b0ff);
      transition: opacity 0.8s ease;
    }

    .const-star.visible {
      opacity: 1;
    }

    .const-line {
      stroke: #c9a0e8;
      stroke-width: 1.2;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .const-line.visible {
      opacity: 0.7;
    }

    /* Texto final */
    #message {
      position: absolute;
      bottom: 18%;
      left: 0;
      right: 0;
      text-align: center;
      opacity: 0;
      transition: opacity 2s ease;
      padding: 0 20px;
    }

    #message.show {
      opacity: 1;
    }

    #message p {
      font-size: 16px;
      line-height: 1.6;
      color: #d8c8f0;
      text-shadow: 0 0 12px rgba(180,140,255,0.4);
    }

    /* Instrucción inicial */
    #hint {
      position: absolute;
      bottom: 12%;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 14px;
      opacity: 0.6;
      transition: opacity 1s;
      letter-spacing: 1px;
    }

    #hint.hide {
      opacity: 0;
      pointer-events: none;
    }

    /* Destellos al tocar */
    .spark {
      position: absolute;
      width: 4px;
      height: 4px;
      background: white;
      border-radius: 50%;
      pointer-events: none;
      animation: sparkle 0.8s forwards;
      box-shadow: 0 0 8px #e0c0ff;
    }

    @keyframes sparkle {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0); opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="sky"></div>

  <!-- Flores -->
  <div class="flower" style="left: 8%; bottom: 0; animation-delay: 0s;">
    <div class="stem"></div>
    <div class="petals">
      <div class="petal"></div><div class="petal"></div><div class="petal"></div>
      <div class="petal"></div><div class="petal"></div>
      <div class="center"></div>
    </div>
  </div>
  <div class="flower" style="left: 22%; bottom: 0; animation-delay: 1.2s; transform: scale(0.85);">
    <div class="stem" style="height: 70px;"></div>
    <div class="petals">
      <div class="petal"></div><div class="petal"></div><div class="petal"></div>
      <div class="petal"></div><div class="petal"></div>
      <div class="center"></div>
    </div>
  </div>
  <div class="flower" style="left: 68%; bottom: 0; animation-delay: 0.6s;">
    <div class="stem" style="height: 100px;"></div>
    <div class="petals">
      <div class="petal"></div><div class="petal"></div><div class="petal"></div>
      <div class="petal"></div><div class="petal"></div>
      <div class="center"></div>
    </div>
  </div>
  <div class="flower" style="left: 82%; bottom: 0; animation-delay: 1.8s; transform: scale(0.75);">
    <div class="stem" style="height: 65px;"></div>
    <div class="petals">
      <div class="petal"></div><div class="petal"></div><div class="petal"></div>
      <div class="petal"></div><div class="petal"></div>
      <div class="center"></div>
    </div>
  </div>

  <!-- Constelación GETSI -->
  <div id="constellation">
    <svg viewBox="0 0 400 140" preserveAspectRatio="xMidYMid meet">
      <!-- Letras aproximadas formadas por puntos -->
      <!-- G -->
      <circle class="const-star" cx="30" cy="40" r="3"/>
      <circle class="const-star" cx="20" cy="60" r="3"/>
      <circle class="const-star" cx="30" cy="85" r="3"/>
      <circle class="const-star" cx="50" cy="95" r="3"/>
      <circle class="const-star" cx="65" cy="75" r="3"/>
      <circle class="const-star" cx="55" cy="55" r="3"/>

      <!-- E -->
      <circle class="const-star" cx="100" cy="35" r="3"/>
      <circle class="const-star" cx="100" cy="60" r="3"/>
      <circle class="const-star" cx="100" cy="90" r="3"/>
      <circle class="const-star" cx="125" cy="35" r="3"/>
      <circle class="const-star" cx="125" cy="60" r="3"/>
      <circle class="const-star" cx="125" cy="90" r="3"/>

      <!-- T -->
      <circle class="const-star" cx="170" cy="35" r="3"/>
      <circle class="const-star" cx="190" cy="35" r="3"/>
      <circle class="const-star" cx="210" cy="35" r="3"/>
      <circle class="const-star" cx="190" cy="60" r="3"/>
      <circle class="const-star" cx="190" cy="90" r="3"/>

      <!-- S -->
      <circle class="const-star" cx="255" cy="40" r="3"/>
      <circle class="const-star" cx="240" cy="55" r="3"/>
      <circle class="const-star" cx="255" cy="70" r="3"/>
      <circle class="const-star" cx="270" cy="85" r="3"/>
      <circle class="const-star" cx="255" cy="100" r="3"/>

      <!-- I -->
      <circle class="const-star" cx="310" cy="35" r="3"/>
      <circle class="const-star" cx="310" cy="60" r="3"/>
      <circle class="const-star" cx="310" cy="90" r="3"/>

      <!-- Líneas de conexión (aparecerán después) -->
      <line class="const-line" x1="30" y1="40" x2="20" y2="60"/>
      <line class="const-line" x1="20" y1="60" x2="30" y2="85"/>
      <line class="const-line" x1="30" y1="85" x2="50" y2="95"/>
      <line class="const-line" x1="50" y1="95" x2="65" y2="75"/>
      <line class="const-line" x1="65" y1="75" x2="55" y2="55"/>

      <line class="const-line" x1="100" y1="35" x2="100" y2="60"/>
      <line class="const-line" x1="100" y1="60" x2="100" y2="90"/>
      <line class="const-line" x1="100" y1="35" x2="125" y2="35"/>
      <line class="const-line" x1="100" y1="60" x2="125" y2="60"/>
      <line class="const-line" x1="100" y1="90" x2="125" y2="90"/>

      <line class="const-line" x1="170" y1="35" x2="210" y2="35"/>
      <line class="const-line" x1="190" y1="35" x2="190" y2="90"/>

      <line class="const-line" x1="255" y1="40" x2="240" y2="55"/>
      <line class="const-line" x1="240" y1="55" x2="255" y2="70"/>
      <line class="const-line" x1="255" y1="70" x2="270" y2="85"/>
      <line class="const-line" x1="270" y1="85" x2="255" y2="100"/>

      <line class="const-line" x1="310" y1="35" x2="310" y2="90"/>
    </svg>
  </div>

  <div id="hint">Toca la pantalla</div>

  <div id="message">
    <p>Algunas estrellas brillan más fuerte<br>cuando tienen un nombre especial.</p>
  </div>

  <script>
    // Crear estrellas de fondo
    const sky = document.getElementById('sky');
    for (let i = 0; i < 120; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = Math.random() * 2.2 + 0.8;
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.animationDelay = Math.random() * 4 + 's';
      s.style.animationDuration = (2 + Math.random() * 3) + 's';
      sky.appendChild(s);
    }

    // Constelación
    const stars = document.querySelectorAll('.const-star');
    const lines = document.querySelectorAll('.const-line');
    let started = false;

    function startConstellation() {
      if (started) return;
      started = true;
      document.getElementById('hint').classList.add('hide');

      // Aparecer estrellas una por una
      stars.forEach((star, i) => {
        setTimeout(() => {
          star.classList.add('visible');
        }, i * 180);
      });

      // Después las líneas
      setTimeout(() => {
        lines.forEach((line, i) => {
          setTimeout(() => {
            line.classList.add('visible');
          }, i * 120);
        });
      }, stars.length * 180 + 400);

      // Mensaje final
      setTimeout(() => {
        document.getElementById('message').classList.add('show');
      }, stars.length * 180 + lines.length * 120 + 1200);
    }

    // Interacción: tocar crea destellos + inicia constelación
    function createSpark(x, y) {
      const spark = document.createElement('div');
      spark.className = 'spark';
      spark.style.left = x + 'px';
      spark.style.top = y + 'px';
      document.body.appendChild(spark);
      setTimeout(() => spark.remove(), 800);
    }

    function handleInteraction(e) {
      const touch = e.touches ? e.touches[0] : e;
      createSpark(touch.clientX, touch.clientY);
      startConstellation();
    }

    document.addEventListener('click', handleInteraction);
    document.addEventListener('touchstart', handleInteraction, { passive: true });
  </script>
</body>
</html>
